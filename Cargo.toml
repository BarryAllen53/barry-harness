[workspace]
resolver = "3"
members = [
    "crates/bh-anthropic",
    "crates/bh-antigravity",
    "crates/bh-auth",
    "crates/bh-cli",
    "crates/bh-config",
    "crates/bh-gemini",
    "crates/bh-openai",
    "crates/bh-provider",
    "crates/bh-store",
    "crates/bh-types",
    "frontend",
    "src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
authors = ["Barry Harness contributors"]
description = "Windows desktop chat client and command line for Claude, ChatGPT, Gemini and Antigravity models"
license = "MIT"
repository = "https://github.com/BarryAllen53/barry-harness"
homepage = "https://github.com/BarryAllen53/barry-harness#readme"
readme = "README.md"
keywords = ["llm", "chat", "tauri", "leptos", "desktop"]
categories = ["gui", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
base64 = "0.22.1"
bh-anthropic = { path = "crates/bh-anthropic" }
bh-antigravity = { path = "crates/bh-antigravity" }
bh-auth = { path = "crates/bh-auth" }
bh-config = { path = "crates/bh-config" }
bh-gemini = { path = "crates/bh-gemini" }
bh-openai = { path = "crates/bh-openai" }
bh-provider = { path = "crates/bh-provider" }
bh-store = { path = "crates/bh-store" }
bh-types = { path = "crates/bh-types" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
js-sys = "0.3.107"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
leptos = { version = "0.8.23", features = ["csr"] }
ra-ap-rustc_lexer = "0.186.0"
rand = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
tauri = "2.12.7"
tauri-build = "2.7.6"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
urlencoding = "2.1.3"
walkdir = "2.5.1"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
